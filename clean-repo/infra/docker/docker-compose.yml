# ─────────────────────────────────────────────────────────────────────────────
# MARKETER-PRO — DOCKER COMPOSE
# Local development environment. Runs Redis for BullMQ.
# Database is Supabase (cloud) — not run locally.
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

services:

  # ── Redis — BullMQ job queues ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: marketer-pro-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend — Express API ──────────────────────────────────────────────────
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: marketer-pro-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      REDIS_URL: redis://redis:6379
    env_file:
      - ../../apps/backend/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/backend/src:/app/src:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
    driver: local    restart: unless-stopped
