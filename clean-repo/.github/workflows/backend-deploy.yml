# ─────────────────────────────────────────────────────────────────────────────
# BACKEND CI/CD — GitHub Actions
# Triggers on push to main. Runs tests, builds, deploys to Railway.
# ─────────────────────────────────────────────────────────────────────────────

name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'clean-repo/apps/backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Type check + lint ────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: '9' }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @marketer-pro/backend db:generate

      - name: Type check
        run: pnpm --filter @marketer-pro/backend typecheck

  # ── Deploy to Railway ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    needs: typecheck
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend
        run: |
          cd apps/backend
          railway up --service marketer-pro-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify deployment
        if: success()
        run: echo "✅ Backend deployed to Railway successfully"
  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build backend
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @marketer-pro/backend build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
          retention-days: 1

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist

      - name: Deploy
        # Replace this step with your hosting provider's deploy action.
        # Examples:
        #   Railway:  railwayapp/railway-action
        #   Render:   curl to Render deploy hook
        #   Fly.io:   superfly/flyctl-actions
        #   AWS ECS:  aws-actions/amazon-ecs-deploy-task-definition
        run: |
          echo "Deploy step — configure with your hosting provider"
          echo "Available secrets: DEPLOY_HOOK_URL, DATABASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY"
        env:
          DEPLOY_HOOK_URL:    ${{ secrets.DEPLOY_HOOK_URL }}
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Notify on success
        if: success()
        run: echo "Backend deployed successfully to production"

      - name: Notify on failure
        if: failure()
        run: echo "Backend deployment failed — check logs"
